<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
</head>
<body>
<div id="app">
    <h3>Student Management</h3>
    <input v-model="studentForm.name" placeholder="Name" required>
    <input v-model="studentForm.age" placeholder="Age" type="number" required>
    <input v-model="studentForm.course" placeholder="Course" required>
    <button @click="addStudent">Add Student</button>

    <ul>
        <li v-for="student in students" :key="student.id">
            {{ student.name }} - {{ student.course }}
        </li>
    </ul>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            students: [],
            studentForm: { name: '', age: null, course: '' }
        },
        methods: {
            async fetchStudents() {
                const response = await fetch('http://localhost:8081/students');
                this.students = await response.json();
            },
            async addStudent() {
                await fetch('http://localhost:8081/students', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.studentForm)
                });
                this.studentForm = { name: '', age: null, course: '' };
                this.fetchStudents();
            }
        },
        mounted() {
            this.fetchStudents();
        }
    });
</script>
</body>
</html>
